<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#551a8b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#69f6b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- Book icon -->
  <g transform="translate(50, 50)">
    <!-- Open book -->
    <path d="M -20 -10 L -20 15 L -2 12 L -2 -13 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 2 -13 L 2 12 L 20 15 L 20 -10 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Book spine -->
    <rect x="-2" y="-13" width="4" height="25" fill="#ffffff" opacity="0.7"/>
    
    <!-- Brain/AI symbol on top -->
    <circle cx="0" cy="-20" r="8" fill="#69f6b8" opacity="0.9"/>
    <path d="M -3 -23 Q 0 -26 3 -23" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <path d="M -3 -20 Q 0 -17 3 -20" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <circle cx="-2" cy="-21" r="1" fill="#ffffff"/>
    <circle cx="2" cy="-21" r="1" fill="#ffffff"/>
  </g>
</svg>
